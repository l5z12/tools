[package]
name = "l5z12-tools"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Local browser utilities powered by Rust and WebAssembly"
repository = "https://github.com/l5z12/tools"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = "1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
ciborium = "0.2.2"
ciborium-ll = "0.2.2"
sourcemap = "9"
rustc-demangle = "0.1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
wat = "1.259"
wasmparser = "0.259"
wasmprinter = "0.259"
wasm-bindgen = "=0.2.127"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
regex = "1"
url = "2"
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
unicode-segmentation = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_yaml_ng = "0.10"
toml = "0.9"
miniz_oxide = "0.8"
crc32fast = "1"
semver = "1"
shlex = "1"
cron = "0.17"
jsonschema = {version = "0.33", default-features = false}
hmac = "0.12"
x509-parser = "0.18"
pem = "3"
sqlparser = {version = "0.58", default-features = false, features = ["std", "serde"]}
sqlformat = "0.3"
graphql-parser = "0.4"
json-patch = "4"
roxmltree = "0.20"
encoding_rs = "0.8"
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate", "deflate-flate2-zlib-rs", "deflate64", "lzma"] }
tar = "0.4"
flate2 = {version = "1", default-features = false, features = ["rust_backend"]}
brotli = "9"
ruzstd = "0.8"
data-encoding = "2"
bs58 = "0.5"
quoted_printable = "0.5"
aes-gcm = {version="0.10", default-features=false, features=["aes","alloc"]}
chacha20poly1305 = {version="0.10", default-features=false, features=["alloc"]}
aes = "0.9"
cbc = {version="0.1", features=["alloc", "block-padding"]}
cbc02 = { package = "cbc", version = "0.2", features = ["alloc", "block-padding"] }
ctr = "0.10"
des = "0.8"
blowfish = "0.9"
twofish = "0.8"
serpent = "0.5"
camellia = "0.1"
pbkdf2 = "0.12"
hkdf = "0.12"
rc4 = "0.1"
sha1 = "0.10"
sha3 = "0.10"
md2 = "0.10"
md4 = "0.10"
md-5 = "0.11"
ripemd = "0.1"
blake2 = "0.10"
blake3 = "1"
whirlpool = "0.10"
sm3 = "0.4"
streebog = "0.11"
gost94 = "0.10"
tiger = "0.2"
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }
murmur3 = "0.5"
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["aes256_wasm", "compress", "bzip2", "ppmd", "deflate"] }
rars = "=0.9.4"
cpp_demangle = "0.5.1"
msvc-demangler = "0.11"
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto", "use_pem"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
oxvg_optimiser = "0.0.5"
oxvg_ast = { version = "0.0.5", features = ["parse", "roxmltree"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.wasm32-unknown-unknown.dependencies]
getrandom02 = { version = "0.2", package = "getrandom", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
