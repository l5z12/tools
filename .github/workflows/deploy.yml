# SPDX-License-Identifier: AGPL-3.0-only
name: Deploy to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    uses: ./.github/workflows/publish.yml
    secrets: inherit
